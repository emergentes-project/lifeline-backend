spring:
  application:
    name: lifeline
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lifeline}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
      naming:
        physical-strategy: com.upc.pe.lifeline.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
  artemis:
    mode: native
    broker-url: ${ARTEMIS_BROKER_URL:tcp://localhost:61616}
    user: ${ARTEMIS_USER:admin}
    password: ${ARTEMIS_PASSWORD:admin}
  servlet:
    multipart:
      max-file-size: ${IMAGE_MAX_FILE_SIZE:10MB}
      max-request-size: ${IMAGE_MAX_REQUEST_SIZE:11MB}

authorization:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:lifeline}
    expiration: ${JWT_EXPIRATION:PT1H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

cloudinary:
  enabled: ${CLOUDINARY_ENABLED:true}
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  max-file-size: ${IMAGE_MAX_FILE_SIZE:10MB}
  download-url-duration: ${CLOUDINARY_DOWNLOAD_URL_DURATION:PT1M}

server:
  port: ${SERVER_PORT:8080}

lifeline:
  outbox:
    destination: ${LIFELINE_OUTBOX_DESTINATION:lifeline.case.jobs}
    batch-size: ${LIFELINE_OUTBOX_BATCH_SIZE:20}
    publish-delay: ${LIFELINE_OUTBOX_PUBLISH_DELAY:5s}
    claim-lease: ${LIFELINE_OUTBOX_CLAIM_LEASE:2m}
    max-attempts: ${LIFELINE_OUTBOX_MAX_ATTEMPTS:5}

---
spring:
  config:
    activate:
      on-profile: local
    import: "optional:file:.env.local[.properties]"
cloudinary:
  enabled: ${CLOUDINARY_ENABLED:false}

---
spring:
  config:
    activate:
      on-profile: prod
    import: "optional:file:.env.prod[.properties]"
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
